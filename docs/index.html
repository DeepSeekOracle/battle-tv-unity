<script>
(function () {
  var year = document.getElementById("bt-year");
  if (year) year.textContent = String(new Date().getFullYear());
  window.battleTvSetScreen = function (mode) {
    var root = document.getElementById("battle-tv-chrome");
    if (root) root.setAttribute("data-screen", mode || "intro");
  };
  var musicOff = false;
  function bed() { return document.getElementById("intro-bed"); }
  function applyBed() {
    var node = bed();
    if (!node) return;
    var radioOn = window.battleTvRadioPlaying && window.battleTvRadioPlaying();
    node.muted = musicOff || radioOn;
    if (!node.muted && window.battleTvStartIntro) window.battleTvStartIntro();
  }
  var opt = document.getElementById("bt-options");
  var optBtn = document.getElementById("bt-options-btn");
  if (optBtn) optBtn.addEventListener("click", function () { opt.classList.toggle("open"); });
  var musicBtn = document.getElementById("bt-music");
  if (musicBtn) musicBtn.addEventListener("click", function () {
    musicOff = !musicOff;
    musicBtn.textContent = musicOff ? "Music off" : "Music on";
    applyBed();
  });
  var full = document.getElementById("bt-full");
  if (full) full.addEventListener("click", function () {
    var native = document.getElementById("unity-fullscreen-button");
    if (native) native.click();
  });
  var tracks = [];
  var bag = [];
  var index = 0;
  var playing = false;
  var muted = false;
  var vol = 0.55;
  try {
    var saved = JSON.parse(localStorage.getItem("lygo_lattice_arena_radio") || "{}");
    if (typeof saved.vol === "number") vol = Math.max(0, Math.min(1, saved.vol));
    if (saved.muted) muted = true;
  } catch (e) {}
  function saveRadio() {
    try { localStorage.setItem("lygo_lattice_arena_radio", JSON.stringify({ vol: vol, muted: muted })); } catch (e) {}
  }
  var audio = document.getElementById("bt-radio-el");
  var title = document.getElementById("bt-radio-title");
  var playBtn = document.getElementById("bt-radio-play");
  var volInput = document.getElementById("bt-radio-vol");
  function paint() {
    var track = tracks[index];
    if (title) title.textContent = track ? track.title : "Radio";
    if (playBtn) playBtn.textContent = playing ? "Pause" : "Play";
    var muteBtn = document.getElementById("bt-radio-mute");
    if (muteBtn) muteBtn.textContent = muted ? "Unmute" : "Mute";
    if (audio) { audio.volume = vol; audio.muted = muted; }
    if (volInput && document.activeElement !== volInput) volInput.value = String(Math.round(vol * 100));
  }
  function refill() {
    bag = tracks.map(function (_, i) { return i; });
    for (var i = bag.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var swap = bag[i]; bag[i] = bag[j]; bag[j] = swap;
    }
  }
  function loadAt(i) {
    if (!tracks.length || !audio) return;
    index = ((i % tracks.length) + tracks.length) % tracks.length;
    audio.src = tracks[index].url;
    paint();
  }
  var hopping = false;
  function next() {
    if (hopping) return;
    hopping = true;
    if (!bag.length) refill();
    var i = bag.pop();
    loadAt(i == null ? 0 : i);
    hopping = false;
    if (playing && audio && audio.src) audio.play().catch(function () {});
  }
  window.battleTvRadioPlaying = function () { return playing && !muted; };
  if (playBtn) playBtn.addEventListener("click", function () {
    if (!tracks.length) return;
    if (playing) { audio.pause(); playing = false; paint(); applyBed(); return; }
    playing = true;
    if (!audio.src) next();
    applyBed();
    audio.play().catch(function () { next(); });
    paint();
  });
  var nextBtn = document.getElementById("bt-radio-next");
  if (nextBtn) nextBtn.addEventListener("click", function () { playing = true; applyBed(); next(); });
  var muteBtn = document.getElementById("bt-radio-mute");
  if (muteBtn) muteBtn.addEventListener("click", function () {
    muted = !muted; saveRadio(); paint(); applyBed();
  });
  if (volInput) volInput.addEventListener("input", function () {
    vol = Number(volInput.value) / 100;
    if (vol > 0 && muted) muted = false;
    saveRadio(); paint(); applyBed();
  });
  if (audio) {
    audio.addEventListener("ended", function () { playing = true; next(); });
    audio.addEventListener("error", function () { if (playing && !hopping) next(); });
  }
  fetch("StreamingAssets/menu/radio.json").then(function (r) { return r.json(); }).then(function (data) {
    var raw = data.tracks || data;
    tracks = raw.filter(function (t) { return t && (t.url || t.stream_url); }).map(function (t) {
      return { title: t.title || t.name || "Untitled", url: t.url || t.stream_url };
    });
    refill();
    paint();
  }).catch(function () { if (title) title.textContent = "Radio offline"; });
  paint();
  function holdRest() {
    if (document.visibilityState !== "visible") return;
    var nodes = document.getElementsByTagName("video");
    for (var i = 0; i < nodes.length; i++) {
      var v = nodes[i];
      var src = v.currentSrc || v.src || "";
      if (src.indexOf("Vale-vs-Brute-push") !== -1) continue;
      if (src.indexOf("Vale-vs-Brute-rest") === -1 && !v.loop) continue;
      v.loop = true;
      if (v.ended) v.currentTime = 0;
      if (v.paused || v.ended) {
        var attempt = v.play();
        if (attempt && attempt.catch) attempt.catch(function () {});
      }
    }
  }
  document.addEventListener("visibilitychange", holdRest);
  setInterval(holdRest, 1500);
})();
</script>
